<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Order Confirmed — Craft Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --espresso:#120B07; --bark:#2A1810; --copper:#C8722A; --gold:#E8A44A;
      --cream:#F5ECD7; --cream-dim:#D9CDB8; --sand:#8C7B66; --card-bg:#1E120C;
      --success:#3DAA6A; --warning:#E67E22; --error:#C0392B;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'DM Sans',sans-serif;background:var(--espresso);color:var(--cream);min-height:100vh;}

    /* CELEBRATION HEADER */
    .conf-header{
      background:linear-gradient(160deg,var(--bark) 0%,#3a1d10 100%);
      text-align:center;padding:48px 24px 36px;
      position:relative;overflow:hidden;
    }
    .conf-header::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(circle at 50% 0%,rgba(200,114,42,.25),transparent 70%);
    }
    .conf-anim{font-size:4rem;margin-bottom:16px;animation:pop .6s cubic-bezier(.36,.07,.19,.97) both;}
    @keyframes pop{0%{transform:scale(0) rotate(-10deg);opacity:0;}70%{transform:scale(1.15);opacity:1;}100%{transform:scale(1);}}
    .conf-title{
      font-family:'Cormorant Garamond',serif;
      font-size:2rem;font-weight:700;color:var(--cream);margin-bottom:6px;
    }
    .conf-sub{font-size:.9rem;color:var(--cream-dim);font-weight:300;}

    /* CONF CODE */
    .conf-code-wrap{
      display:inline-block;
      background:rgba(200,114,42,.12);
      border:1px solid rgba(200,114,42,.35);
      border-radius:14px;padding:16px 28px;
      margin-top:20px;
    }
    .code-label{font-size:.7rem;color:var(--sand);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;}
    .code-value{
      font-family:'Cormorant Garamond',serif;
      font-size:1.7rem;font-weight:700;color:var(--gold);letter-spacing:.06em;
    }

    /* MAIN */
    .page-wrap{max-width:500px;margin:0 auto;padding:24px 20px 32px;}

    /* STEPPER */
    .stepper{
      display:flex;align-items:center;justify-content:center;
      gap:0;margin-bottom:24px;
    }
    .step{
      display:flex;flex-direction:column;align-items:center;
      gap:6px;flex:1;
    }
    .step-dot{
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:.85rem;font-weight:600;
      transition:all .4s ease;
    }
    .step-dot.done{background:var(--success);color:#fff;}
    .step-dot.active{background:var(--copper);color:#fff;box-shadow:0 0 0 4px rgba(200,114,42,.25);}
    .step-dot.pending{background:var(--bark);color:var(--sand);border:2px solid rgba(255,255,255,.1);}
    .step-label{font-size:.68rem;color:var(--sand);text-align:center;font-weight:500;}
    .step-line{
      flex:1;height:2px;background:rgba(255,255,255,.08);
      max-width:40px;margin-bottom:20px;
      position:relative;overflow:hidden;
    }
    .step-line.done::after{content:'';position:absolute;inset:0;background:var(--success);}

    /* CARDS */
    .card{
      background:var(--card-bg);border:1px solid rgba(255,255,255,.07);
      border-radius:16px;padding:20px;margin-bottom:16px;
    }
    .card-head{
      font-family:'Cormorant Garamond',serif;
      font-size:1.05rem;font-weight:600;color:var(--gold);
      margin-bottom:14px;display:flex;align-items:center;gap:8px;
    }

    /* STATUS */
    .status-pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 18px;border-radius:30px;
      font-size:.85rem;font-weight:600;
    }
    .status-pill.pending  {background:rgba(230,126,34,.15);color:#E67E22;border:1px solid rgba(230,126,34,.3);}
    .status-pill.confirmed{background:rgba(52,152,219,.15);color:#3498DB;border:1px solid rgba(52,152,219,.3);}
    .status-pill.cooking  {background:rgba(200,114,42,.15);color:var(--copper);border:1px solid rgba(200,114,42,.3);}
    .status-pill.completed{background:rgba(61,170,106,.15);color:var(--success);border:1px solid rgba(61,170,106,.3);}
    .status-pill.verified {background:rgba(61,170,106,.15);color:var(--success);border:1px solid rgba(61,170,106,.3);}
    .status-pill.rejected {background:rgba(192,57,43,.15);color:var(--error);border:1px solid rgba(192,57,43,.3);}
    .status-pill.cash_on_delivery{background:rgba(61,170,106,.15);color:var(--success);border:1px solid rgba(61,170,106,.3);}

    .status-block{text-align:center;padding:16px 0;}
    .status-updated{font-size:.75rem;color:var(--sand);margin-top:10px;}

    /* ORDER ROWS */
    .sum-row{
      display:flex;justify-content:space-between;
      padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);
      font-size:.88rem;
    }
    .sum-row:last-child{border:none;}
    .sum-label{color:var(--cream-dim);}
    .sum-val{font-weight:600;}
    .total-row{
      display:flex;justify-content:space-between;align-items:center;
      margin-top:12px;padding-top:12px;
      border-top:1px solid rgba(200,114,42,.2);
    }
    .total-lbl{font-size:.85rem;color:var(--sand);}
    .total-amt{
      font-family:'Cormorant Garamond',serif;
      font-size:1.6rem;font-weight:700;color:var(--gold);
    }

    /* BUTTONS */
    .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
    .btn{
      padding:14px 10px;border:none;border-radius:12px;
      font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;
      cursor:pointer;transition:all .25s ease;
      display:flex;align-items:center;justify-content:center;gap:8px;
    }
    .btn-primary{background:linear-gradient(135deg,var(--copper),var(--gold));color:#fff;}
    .btn-secondary{background:var(--bark);color:var(--cream-dim);border:1px solid rgba(255,255,255,.1);}
    .btn:hover{transform:translateY(-2px);opacity:.9;}

    /* REFRESH */
    .refresh-note{
      text-align:center;font-size:.75rem;color:var(--sand);
      margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--success);animation:blink 2s ease infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

    /* PAYMENT METHOD DISPLAY */
    .payment-detail{
      display:flex;align-items:center;gap:10px;
      padding:10px 14px;background:var(--espresso);
      border-radius:10px;font-size:.85rem;color:var(--cream-dim);
    }
    .payment-detail i{color:var(--copper);}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="conf-header">
  <div class="conf-anim" id="headerAnim">✅</div>
  <div class="conf-title" id="headerTitle">Order Confirmed!</div>
  <div class="conf-sub" id="headerSub">Your order has been received by the kitchen.</div>
  <div class="conf-code-wrap">
    <div class="code-label">Confirmation Number</div>
    <div class="code-value" id="confCode">—</div>
  </div>
</div>

<div class="page-wrap">

  <!-- ORDER STATUS TRACKER -->
  <div class="card">
    <div class="card-head"><i class="fas fa-hourglass-half" style="color:var(--copper)"></i>Order Status</div>
    <div class="status-block">
      <div class="status-pill pending" id="statusPill">
        <i class="fas fa-clock"></i> <span id="statusText">Pending</span>
      </div>
      <div class="status-updated" id="statusUpdated"></div>
    </div>

    <!-- STEPPER -->
    <div class="stepper" id="stepper">
      <div class="step">
        <div class="step-dot done" id="dot0"><i class="fas fa-check"></i></div>
        <div class="step-label">Placed</div>
      </div>
      <div class="step-line" id="line1"></div>
      <div class="step">
        <div class="step-dot pending" id="dot1"><i class="fas fa-clock"></i></div>
        <div class="step-label">Confirmed</div>
      </div>
      <div class="step-line" id="line2"></div>
      <div class="step">
        <div class="step-dot pending" id="dot2"><i class="fas fa-fire"></i></div>
        <div class="step-label">Cooking</div>
      </div>
      <div class="step-line" id="line3"></div>
      <div class="step">
        <div class="step-dot pending" id="dot3"><i class="fas fa-check-double"></i></div>
        <div class="step-label">Ready</div>
      </div>
    </div>

    <div class="refresh-note">
      <span class="refresh-dot"></span>
      Auto-refreshing every 30 seconds
    </div>
  </div>

  <!-- ORDER ITEMS -->
  <div class="card">
    <div class="card-head"><i class="fas fa-utensils" style="color:var(--copper)"></i>Your Items</div>
    <div id="orderItems"></div>
    <div class="total-row">
      <span class="total-lbl">Total</span>
      <span class="total-amt" id="totalAmt">$0.00</span>
    </div>
  </div>

  <!-- PAYMENT INFO -->
  <div class="card" id="paymentCard">
    <div class="card-head"><i class="fas fa-receipt" style="color:var(--copper)"></i>Payment</div>
    <div class="payment-detail" id="paymentDetail">
      <i class="fas fa-spinner fa-spin"></i> Loading…
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="btn-row">
    <button class="btn btn-primary" onclick="window.location.href='index.html'+tableParam()">
      <i class="fas fa-plus"></i> Order More
    </button>
    <button class="btn btn-secondary" onclick="checkStatus()">
      <i class="fas fa-sync-alt" id="refreshIcon"></i> Refresh Status
    </button>
  </div>

</div>

<script>
const API = 'https://n8n-n64x.onrender.com/webhook';
let orderData     = null;
let pollInterval  = null;
let lastStatus    = null;

/* ── LOAD ──────────────────────────────────── */
function init() {
  const urlP = new URLSearchParams(location.search);
  const enc  = urlP.get('order');
  const stored = sessionStorage.getItem('pending_order');

  try {
    orderData = enc ? JSON.parse(decodeURIComponent(enc)) : (stored ? JSON.parse(stored) : null);
  } catch(e) { orderData = null; }

  if(!orderData) {
    document.getElementById('confCode').textContent = 'No data';
    return;
  }

  // Confirmation code
  document.getElementById('confCode').textContent = orderData.confirmation_number || '—';

  // Items
  const items = orderData.items || [];
  document.getElementById('orderItems').innerHTML = items.map(i => `
    <div class="sum-row">
      <span class="sum-label">${esc(i.name)} × ${i.quantity}</span>
      <span class="sum-val">$${(i.price*i.quantity).toFixed(2)}</span>
    </div>`).join('') || '<div class="sum-row"><span class="sum-label">—</span></div>';

  document.getElementById('totalAmt').textContent = `$${parseFloat(orderData.total||0).toFixed(2)}`;

  // Payment method
  const pIcons = {cash:'money-bill-wave',card:'credit-card',mobile_money:'mobile-alt',paypal:'fab fa-paypal'};
  const pLabels = {cash:'Cash on Delivery',card:'Credit / Debit Card',mobile_money:'Mobile Money',paypal:'PayPal'};
  const pm = orderData.payment_method || 'cash';
  document.getElementById('paymentDetail').innerHTML = `
    <i class="fas ${pIcons[pm]||'credit-card'}"></i>
    <span>${pLabels[pm]||pm} &nbsp;<span style="color:var(--sand);font-size:.78rem;">${orderData.card_last4?'····'+orderData.card_last4:''}</span></span>`;

  // Initial status
  applyStatus(orderData.status||'pending', orderData.payment_status||'pending');

  // Poll
  checkStatus();
  pollInterval = setInterval(checkStatus, 30000);
}

/* ── STATUS CHECK ──────────────────────────── */
async function checkStatus() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('fa-spin');

  try {
    const r = await fetch(`${API}/check-status`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({confirmation_number: orderData.confirmation_number})
    });
    if(!r.ok) throw new Error('Server error');
    const d = await r.json();
    if(d.success) {
      applyStatus(d.status, d.payment_status);
      const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      document.getElementById('statusUpdated').textContent = `Last updated at ${ts}`;

      // Stop polling if completed
      if(d.status === 'completed' && pollInterval) {
        clearInterval(pollInterval);
        pollInterval = null;
      }
    }
  } catch(e) { /* silent */ }

  icon.classList.remove('fa-spin');
}

/* ── APPLY STATUS ──────────────────────────── */
function applyStatus(status, payStatus) {
  const displayStatus = payStatus === 'cash_on_delivery' ? 'confirmed' : (payStatus === 'verified' ? 'verified' : status);
  const effective = displayStatus || status || 'pending';

  // Pill
  const pill = document.getElementById('statusPill');
  const statusLabels = {
    pending:'Pending — Awaiting confirmation',
    confirmed:'Confirmed — Kitchen notified',
    cooking:'Cooking — Hang tight!',
    completed:'Ready — Enjoy your meal! 🎉',
    verified:'Payment Verified',
    rejected:'Payment Rejected',
    cash_on_delivery:'Confirmed — Pay on delivery'
  };
  pill.className = `status-pill ${effective}`;
  document.getElementById('statusText').textContent = statusLabels[effective] || cap(effective);

  // Stepper
  const order = ['pending','confirmed','cooking','completed'];
  const idx   = order.indexOf(effective.replace('verified','confirmed').replace('cash_on_delivery','confirmed'));
  for(let i=0;i<4;i++){
    const dot = document.getElementById(`dot${i}`);
    const line = i>0 ? document.getElementById(`line${i}`) : null;
    if(i < idx)      { dot.className='step-dot done'; if(line)line.className='step-line done'; }
    else if(i===idx) { dot.className='step-dot active'; }
    else             { dot.className='step-dot pending'; }
  }

  // Header emoji
  if(effective==='completed') {
    document.getElementById('headerAnim').textContent = '🎉';
    document.getElementById('headerTitle').textContent = 'Order Ready!';
    document.getElementById('headerSub').textContent = 'Your food is ready. Enjoy your meal!';
  } else if(effective==='rejected') {
    document.getElementById('headerAnim').textContent = '❌';
    document.getElementById('headerTitle').textContent = 'Payment Issue';
    document.getElementById('headerSub').textContent = 'Please contact a staff member.';
  }
}

function tableParam(){
  const t = orderData?.room || orderData?.table;
  return t ? `?table=${t}` : '';
}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):'';} 
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
