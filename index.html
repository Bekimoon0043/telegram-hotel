<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Café Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --espresso:  #120B07;
      --bark:      #2A1810;
      --copper:    #C8722A;
      --gold:      #E8A44A;
      --cream:     #F5ECD7;
      --cream-dim: #D9CDB8;
      --sand:      #8C7B66;
      --card-bg:   #1E120C;
      --overlay:   rgba(12,7,4,0.88);
      --success:   #3DAA6A;
      --error:     #C0392B;
      --warning:   #E67E22;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--espresso);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ────────────────────────────────── */
    .site-header {
      position: sticky; top:0; z-index:200;
      background: rgba(18,11,7,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200,114,42,0.2);
      padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
      gap: 8px;
    }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-icon { font-size:1.4rem; color:var(--copper); }
    .brand-name {
      font-family:'Cormorant Garamond',serif;
      font-size:1.25rem; font-weight:600; letter-spacing:.03em;
      color:var(--cream);
    }
    .header-right { display:flex; align-items:center; gap:8px; }
    .table-badge {
      background: var(--bark);
      border: 1px solid var(--copper);
      border-radius:20px;
      padding: 5px 14px;
      font-size:.75rem; font-weight:600;
      color:var(--gold); letter-spacing:.08em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    /* ── LANGUAGE TOGGLE ───────────────────────── */
    .lang-btn {
      background: var(--bark);
      border: 1px solid rgba(200,114,42,0.3);
      border-radius:20px;
      padding: 5px 12px;
      font-size:.72rem; font-weight:700;
      color:var(--cream-dim);
      cursor:pointer;
      transition: all .2s ease;
      white-space:nowrap;
      letter-spacing:.04em;
    }
    .lang-btn:hover { border-color:var(--copper); color:var(--gold); }
    .lang-btn.am { color:var(--gold); border-color:var(--copper); background:rgba(200,114,42,0.12); }

    /* ── HERO ──────────────────────────────────── */
    .hero {
      background: linear-gradient(160deg, var(--bark) 0%, var(--espresso) 60%);
      padding: 36px 24px 28px;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content:'';
      position:absolute; bottom:-1px; left:0; right:0; height:40px;
      background: linear-gradient(to top, var(--espresso), transparent);
    }
    .hero-tagline {
      font-family:'Cormorant Garamond',serif;
      font-size:2.2rem; font-weight:700; line-height:1.15;
      color:var(--cream); margin-bottom:8px;
    }
    .hero-tagline em { color:var(--gold); font-style:italic; }
    .hero-sub { color:var(--cream-dim); font-size:.9rem; font-weight:300; }

    /* ── CATEGORIES ────────────────────────────── */
    .categories-wrap {
      padding: 20px 0 4px;
      position: sticky; top:64px; z-index:100;
      background: var(--espresso);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .categories-scroll {
      display:flex; gap:8px; padding: 0 20px 12px;
      overflow-x:auto; scroll-snap-type:x mandatory;
      scrollbar-width:none;
    }
    .categories-scroll::-webkit-scrollbar { display:none; }
    .cat-btn {
      scroll-snap-align:start;
      flex-shrink:0;
      background: var(--bark);
      border: 1px solid rgba(200,114,42,0.2);
      color: var(--cream-dim);
      border-radius:30px;
      padding:8px 18px;
      font-family:'DM Sans',sans-serif;
      font-size:.82rem; font-weight:500;
      cursor:pointer; transition: all .25s ease;
      white-space:nowrap;
    }
    .cat-btn:hover { border-color:var(--copper); color:var(--cream); }
    .cat-btn.active {
      background: var(--copper);
      border-color: var(--copper);
      color: #fff;
      font-weight:600;
    }

    /* ── MENU GRID ─────────────────────────────── */
    .menu-section { padding: 20px 20px 180px; }
    .menu-grid {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap:14px;
    }

    /* ── MENU CARD ─────────────────────────────── */
    .menu-card {
      background: var(--card-bg);
      border-radius:14px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      cursor:pointer;
      position:relative;
    }
    .menu-card:hover {
      transform:translateY(-4px);
      border-color: rgba(200,114,42,0.4);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .menu-card:active { transform:scale(0.98); }
    .card-img-wrap { position:relative; height:130px; overflow:hidden; }
    .card-img {
      width:100%; height:100%;
      object-fit:cover; transition:transform .4s ease;
    }
    .menu-card:hover .card-img { transform:scale(1.06); }
    .card-unavail-overlay {
      position:absolute; inset:0;
      background:rgba(18,11,7,0.7);
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:600; color:#fff;
      letter-spacing:.1em; text-transform:uppercase;
    }
    .card-body { padding:12px; }
    .card-name {
      font-family:'Cormorant Garamond',serif;
      font-size:1.02rem; font-weight:600;
      color:var(--cream); line-height:1.25;
      margin-bottom:4px;
    }
    .card-desc {
      font-size:.73rem; color:var(--sand);
      line-height:1.4; margin-bottom:10px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .card-footer { display:flex; align-items:center; justify-content:space-between; }
    .card-price { font-size:.95rem; font-weight:600; color:var(--gold); }
    .add-btn {
      width:30px; height:30px;
      background: var(--copper);
      border:none; border-radius:50%;
      color:#fff; font-size:1.1rem;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition: background .2s ease, transform .2s ease;
      line-height:1;
    }
    .add-btn:hover { background:var(--gold); transform:scale(1.12); }
    .qty-control { display:flex; align-items:center; gap:8px; }
    .qty-btn {
      width:26px; height:26px;
      background:transparent; border:1px solid var(--copper);
      border-radius:50%; color:var(--copper);
      font-size:.85rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition: all .2s ease;
    }
    .qty-btn:hover { background:var(--copper); color:#fff; }
    .qty-num { font-size:.9rem; font-weight:600; color:var(--cream); min-width:18px; text-align:center; }

    /* ── LOADING/EMPTY ─────────────────────────── */
    .state-wrap { text-align:center; padding:60px 20px; }
    .state-icon { font-size:3rem; color:var(--sand); margin-bottom:16px; }
    .state-title { font-family:'Cormorant Garamond',serif; font-size:1.5rem; color:var(--cream-dim); margin-bottom:8px; }
    .state-sub { font-size:.9rem; color:var(--sand); }
    .spinner {
      width:40px; height:40px; margin:0 auto 20px;
      border:3px solid rgba(200,114,42,0.2);
      border-top-color:var(--copper);
      border-radius:50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg);} }

    /* ── FLOATING CART ─────────────────────────── */
    .cart-fab {
      position:fixed; bottom:24px; right:20px; z-index:300;
      background: linear-gradient(135deg, var(--copper), var(--gold));
      border:none; border-radius:50px;
      padding:14px 22px;
      color:#fff; font-family:'DM Sans',sans-serif;
      font-size:.9rem; font-weight:600;
      display:flex; align-items:center; gap:10px;
      cursor:pointer; box-shadow:0 8px 24px rgba(200,114,42,0.45);
      transition:all .3s cubic-bezier(.4,0,.2,1);
      transform:translateY(80px); opacity:0;
    }
    .cart-fab.visible { transform:translateY(0); opacity:1; }
    .cart-fab:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 12px 32px rgba(200,114,42,0.55); }
    .cart-fab .fab-count {
      background:#fff; color:var(--copper);
      border-radius:50%; width:22px; height:22px;
      font-size:.75rem; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }

    /* ── BOTTOM ACTION BUTTONS (Waiter + Feedback) ── */
    .bottom-actions {
      position:fixed; bottom:24px; left:20px; z-index:300;
      display:flex; flex-direction:column; gap:10px;
    }
    .action-btn {
      display:flex; align-items:center; gap:8px;
      padding:11px 16px;
      border:none; border-radius:40px;
      font-family:'DM Sans',sans-serif; font-size:.82rem; font-weight:600;
      cursor:pointer; transition:all .25s ease;
      box-shadow:0 4px 16px rgba(0,0,0,0.35);
    }
    .waiter-btn {
      background: var(--bark);
      border:1px solid var(--copper);
      color:var(--gold);
    }
    .waiter-btn:hover { background:var(--copper); color:#fff; transform:translateY(-2px); }
    .waiter-btn.calling {
      background:var(--copper);color:#fff;
      animation:pulseBtn 1s ease infinite;
    }
    @keyframes pulseBtn { 0%,100%{opacity:1;} 50%{opacity:.7;} }
    .feedback-btn {
      background: var(--card-bg);
      border:1px solid rgba(200,114,42,0.25);
      color:var(--cream-dim);
    }
    .feedback-btn:hover { border-color:var(--copper); color:var(--cream); transform:translateY(-2px); }

    /* ── CART DRAWER ───────────────────────────── */
    .drawer-overlay {
      position:fixed; inset:0; z-index:500;
      background:var(--overlay);
      opacity:0; pointer-events:none;
      transition:opacity .3s ease;
    }
    .drawer-overlay.open { opacity:1; pointer-events:all; }
    .cart-drawer {
      position:fixed; bottom:0; left:0; right:0; z-index:501;
      background: var(--bark);
      border-radius:20px 20px 0 0;
      border-top: 2px solid var(--copper);
      padding:0 0 env(safe-area-inset-bottom,0);
      transform:translateY(100%);
      transition:transform .38s cubic-bezier(.4,0,.2,1);
      max-height:90vh;
      display:flex; flex-direction:column;
    }
    .cart-drawer.open { transform:translateY(0); }
    .drawer-handle {
      width:40px; height:4px; border-radius:2px;
      background:rgba(255,255,255,0.2);
      margin:12px auto 0;
    }
    .drawer-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px 12px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .drawer-title { font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:600; }
    .drawer-close { background:transparent; border:none; color:var(--cream-dim); font-size:1.2rem; cursor:pointer; padding:4px; }
    .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
    .cart-item-row {
      display:flex; align-items:center; gap:12px;
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,0.06);
      animation:slideIn .25s ease;
    }
    @keyframes slideIn { from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:none;} }
    .ci-thumb { width:50px; height:50px; border-radius:8px; object-fit:cover; flex-shrink:0; }
    .ci-info { flex:1; }
    .ci-name { font-size:.9rem; font-weight:600; color:var(--cream); }
    .ci-price { font-size:.8rem; color:var(--gold); margin-top:2px; }
    .ci-qty { display:flex; align-items:center; gap:8px; }
    .ci-qty-btn {
      width:26px; height:26px;
      background:var(--espresso); border:1px solid rgba(200,114,42,0.3);
      border-radius:50%; color:var(--cream);
      font-size:.85rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .2s;
    }
    .ci-qty-btn:hover { border-color:var(--copper); color:var(--copper); }
    .ci-qty-num { font-size:.9rem; font-weight:600; min-width:20px; text-align:center; }
    .cart-empty { text-align:center; padding:48px 0; color:var(--sand); font-size:.95rem; }
    .cart-empty-icon { font-size:2.5rem; margin-bottom:12px; }

    .drawer-fields { padding:0 20px 12px; }
    .field-group { margin-bottom:12px; }
    .field-label { font-size:.75rem; font-weight:600; color:var(--sand); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; display:block; }
    .field-input {
      width:100%;
      background:var(--espresso); border:1px solid rgba(255,255,255,0.1);
      border-radius:10px; color:var(--cream);
      padding:10px 14px; font-family:'DM Sans',sans-serif; font-size:.9rem;
      transition:border-color .2s;
    }
    .field-input:focus { outline:none; border-color:var(--copper); }
    .field-input::placeholder { color:var(--sand); }

    .drawer-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.08); }
    .drawer-total { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .drawer-total-label { font-size:.85rem; color:var(--cream-dim); }
    .drawer-total-amount { font-family:'Cormorant Garamond',serif; font-size:1.6rem; font-weight:700; color:var(--gold); }
    .order-btn {
      width:100%; padding:16px;
      background:linear-gradient(135deg,var(--copper),var(--gold));
      border:none; border-radius:14px;
      color:#fff; font-family:'DM Sans',sans-serif;
      font-size:1rem; font-weight:600; letter-spacing:.03em;
      cursor:pointer; transition:all .3s ease;
      display:flex; align-items:center; justify-content:center; gap:10px;
    }
    .order-btn:hover { opacity:.9; transform:translateY(-1px); }
    .order-btn:disabled { background:var(--sand); cursor:not-allowed; transform:none; }

    /* ── TOAST ─────────────────────────────────── */
    .toast {
      position:fixed; top:80px; left:50%; transform:translateX(-50%);
      z-index:600;
      background:var(--card-bg); border:1px solid rgba(200,114,42,0.4);
      border-radius:10px; padding:12px 20px;
      font-size:.88rem; font-weight:500; color:var(--cream);
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      display:flex; align-items:center; gap:10px;
      animation:toastIn .3s ease;
      pointer-events:none;
      max-width:90vw; text-align:center;
    }
    @keyframes toastIn { from{opacity:0;top:60px;} to{opacity:1;top:80px;} }
    .toast.success .toast-icon { color:var(--success); }
    .toast.warning .toast-icon { color:var(--warning); }
    .toast.error   .toast-icon { color:var(--error); }

    /* ── FEEDBACK MODAL ────────────────────────── */
    .modal-overlay {
      position:fixed; inset:0; z-index:700;
      background:var(--overlay);
      display:flex; align-items:flex-end; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .3s;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal-sheet {
      background:var(--bark);
      border:1px solid rgba(200,114,42,0.25);
      border-radius:24px 24px 0 0;
      border-top: 2px solid var(--copper);
      padding:28px 24px 40px;
      width:100%; max-width:520px;
      transform:translateY(40px); transition:transform .35s cubic-bezier(.4,0,.2,1);
    }
    .modal-overlay.open .modal-sheet { transform:translateY(0); }
    .modal-handle { width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,0.15); margin:0 auto 20px; }
    .modal-title {
      font-family:'Cormorant Garamond',serif;
      font-size:1.5rem; font-weight:700;
      color:var(--cream); margin-bottom:4px; text-align:center;
    }
    .modal-sub { color:var(--sand); font-size:.85rem; text-align:center; margin-bottom:20px; }

    /* Star rating */
    .stars { display:flex; justify-content:center; gap:10px; margin-bottom:20px; }
    .star-btn {
      background:transparent; border:none;
      font-size:2rem; cursor:pointer;
      color:rgba(255,255,255,0.2);
      transition:color .15s ease, transform .15s ease;
      padding:0;
    }
    .star-btn.lit { color:var(--gold); }
    .star-btn:hover { transform:scale(1.2); }

    .feedback-textarea {
      width:100%;
      background:var(--espresso); border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; color:var(--cream);
      padding:12px 14px; font-family:'DM Sans',sans-serif; font-size:.9rem;
      resize:none; height:90px;
      transition:border-color .2s;
      margin-bottom:16px;
    }
    .feedback-textarea:focus { outline:none; border-color:var(--copper); }
    .feedback-textarea::placeholder { color:var(--sand); }

    .modal-actions { display:flex; gap:10px; }
    .modal-cancel {
      flex:1; padding:13px;
      background:transparent; border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; color:var(--sand);
      font-family:'DM Sans',sans-serif; font-size:.9rem; font-weight:500;
      cursor:pointer; transition:all .2s;
    }
    .modal-cancel:hover { border-color:var(--copper); color:var(--cream); }
    .modal-submit {
      flex:2; padding:13px;
      background:linear-gradient(135deg,var(--copper),var(--gold));
      border:none; border-radius:12px; color:#fff;
      font-family:'DM Sans',sans-serif; font-size:.9rem; font-weight:600;
      cursor:pointer; transition:opacity .2s;
    }
    .modal-submit:hover { opacity:.88; }

    /* ── RESPONSIVE ────────────────────────────── */
    @media(min-width:600px) {
      .menu-grid { grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); }
      .hero-tagline { font-size:2.8rem; }
      .cart-drawer { max-width:480px; left:auto; right:0; border-radius:20px 20px 0 0; }
      .modal-overlay { align-items:center; }
      .modal-sheet { border-radius:24px; max-width:440px; margin:20px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="brand">
    <i class="fas fa-mug-hot brand-icon"></i>
    <span class="brand-name">The Craft Café</span>
  </div>
  <div class="header-right">
    <button class="lang-btn" id="langBtn" onclick="toggleLang()" title="Switch language / ቋንቋ ቀይር">
      🇪🇹 አማ
    </button>
    <div class="table-badge" id="tableBadge">Table —</div>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-tagline" id="heroTagline">Made with love,<br><em>served with care.</em></div>
  <div class="hero-sub" id="heroSub">Browse our menu and order directly from your table.</div>
</section>

<!-- CATEGORIES -->
<div class="categories-wrap">
  <div class="categories-scroll" id="catScroll">
    <button class="cat-btn active" data-cat="all" id="allCatBtn">All Items</button>
  </div>
</div>

<!-- MENU -->
<section class="menu-section">
  <div class="menu-grid" id="menuGrid">
    <div class="state-wrap" style="grid-column:1/-1;">
      <div class="spinner"></div>
      <div class="state-title" id="loadingText">Loading menu…</div>
    </div>
  </div>
</section>

<!-- BOTTOM ACTION BUTTONS -->
<div class="bottom-actions">
  <button class="action-btn waiter-btn" id="waiterBtn" onclick="callWaiter()">
    <i class="fas fa-bell"></i>
    <span id="waiterBtnLabel">Call Waiter</span>
  </button>
  <button class="action-btn feedback-btn" onclick="openFeedback()">
    <i class="fas fa-star"></i>
    <span id="feedbackBtnLabel">Feedback</span>
  </button>
</div>

<!-- FLOATING CART -->
<button class="cart-fab" id="cartFab" onclick="openCart()">
  <i class="fas fa-shopping-bag"></i>
  <span class="fab-count" id="fabCount">0</span>
  <span id="fabTotal">$0.00</span>
  <i class="fas fa-chevron-up" style="font-size:.7rem;opacity:.7;"></i>
</button>

<!-- DRAWER OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeCart()"></div>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cartDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <div class="drawer-title"><i class="fas fa-shopping-bag" style="color:var(--copper);margin-right:8px;font-size:.9em;"></i><span id="drawerTitleText">Your Order</span></div>
    <button class="drawer-close" onclick="closeCart()"><i class="fas fa-times"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="cart-empty">
      <div class="cart-empty-icon">🛒</div>
      <span id="cartEmptyText">Add items from the menu to get started</span>
    </div>
  </div>
  <div class="drawer-fields">
    <div class="field-group">
      <label class="field-label" for="customerName" id="nameLabel">Your Name</label>
      <input class="field-input" type="text" id="customerName" placeholder="e.g. Alex" maxlength="50">
    </div>
    <div class="field-group">
      <label class="field-label" for="specialNotes" id="notesLabel">Special Instructions</label>
      <input class="field-input" type="text" id="specialNotes" placeholder="Allergies, preferences…" maxlength="200">
    </div>
  </div>
  <div class="drawer-footer">
    <div class="drawer-total">
      <span class="drawer-total-label" id="totalLabel">Total</span>
      <span class="drawer-total-amount" id="drawerTotal">$0.00</span>
    </div>
    <button class="order-btn" id="orderBtn" onclick="placeOrder()">
      <i class="fas fa-credit-card"></i> <span id="orderBtnText">Choose Payment &amp; Order</span>
    </button>
  </div>
</div>

<!-- FEEDBACK MODAL -->
<div class="modal-overlay" id="feedbackModal" onclick="closeFeedbackOnBg(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="fbTitle">How was your experience?</div>
    <div class="modal-sub" id="fbSub">Your feedback helps us serve you better</div>
    <div class="stars" id="starsRow">
      <button class="star-btn" data-val="1" onclick="rateStar(1)">★</button>
      <button class="star-btn" data-val="2" onclick="rateStar(2)">★</button>
      <button class="star-btn" data-val="3" onclick="rateStar(3)">★</button>
      <button class="star-btn" data-val="4" onclick="rateStar(4)">★</button>
      <button class="star-btn" data-val="5" onclick="rateStar(5)">★</button>
    </div>
    <textarea class="feedback-textarea" id="feedbackText" placeholder="Tell us more..." maxlength="400"></textarea>
    <div class="modal-actions">
      <button class="modal-cancel" id="fbCancelBtn" onclick="closeFeedback()">Cancel</button>
      <button class="modal-submit" id="fbSubmitBtn" onclick="submitFeedback()">
        <i class="fas fa-paper-plane"></i> <span id="fbSubmitLabel">Send Feedback</span>
      </button>
    </div>
  </div>
</div>

<script>
const API    = 'https://n8n-n64x.onrender.com/webhook';
const GITHUB = 'https://bekimoon0043.github.io/telegram-hotel';

/* ── URL PARAMS ────────────────────────────── */
const urlParams = new URLSearchParams(location.search);
let tableNum    = urlParams.get('table') || urlParams.get('room') || 'N/A';
let tgChatId    = urlParams.get('telegram_chat_id') || '';

/* ── STATE ─────────────────────────────────── */
let menuItems    = [];
let cart         = [];
let pendingOrder = null;
let currentLang  = 'en';
let feedbackRating = 0;
let waiterCooldown = false;

/* ── TRANSLATIONS ──────────────────────────── */
const T = {
  en: {
    tableBadge: t => t !== 'N/A' ? `Table ${t}` : 'Walk-in',
    langBtn: '🇪🇹 አማ',
    heroTagline: 'Made with love,<br><em>served with care.</em>',
    heroSub: 'Browse our menu and order directly from your table.',
    allItems: 'All Items',
    loading: 'Loading menu…',
    menuUnavail: 'Menu unavailable',
    menuUnavailSub: 'Please check your connection and try again.',
    nothingHere: 'Nothing here yet',
    unavail: 'Unavailable',
    drawerTitle: 'Your Order',
    cartEmpty: 'Add items from the menu to get started',
    nameLabel: 'Your Name',
    namePlaceholder: 'e.g. Alex',
    notesLabel: 'Special Instructions',
    notesPlaceholder: 'Allergies, preferences…',
    totalLabel: 'Total',
    orderBtn: 'Choose Payment &amp; Order',
    waiterBtn: 'Call Waiter',
    waiterCalling: 'Calling…',
    feedbackBtn: 'Feedback',
    fbTitle: 'How was your experience?',
    fbSub: 'Your feedback helps us serve you better',
    fbPlaceholder: 'Tell us more...',
    fbCancel: 'Cancel',
    fbSubmit: 'Send Feedback',
    toastAddedTo: 'added to order',
    toastWaiterCalled: 'Waiter has been notified!',
    toastWaiterWait: 'Please wait before calling again.',
    toastWaiterFail: 'Could not reach waiter. Please try again.',
    toastFbSent: 'Thank you for your feedback! ❤️',
    toastFbNoRating: 'Please select a star rating first.',
    toastCartEmpty: 'Your cart is empty',
  },
  am: {
    tableBadge: t => t !== 'N/A' ? `ጠረጴዛ ${t}` : 'ቀጥታ ደንበኛ',
    langBtn: '🇬🇧 EN',
    heroTagline: 'በፍቅር የተሰራ,<br><em>በእንክብካቤ የቀረበ።</em>',
    heroSub: 'ምናሌያችንን ይፈልጉ እና ቀጥታ ከጠረጴዛዎ ይዘዙ።',
    allItems: 'ሁሉም',
    loading: 'ምናሌ በመጫን ላይ…',
    menuUnavail: 'ምናሌ አልተገኘም',
    menuUnavailSub: 'ግንኙነትዎን ያረጋግጡ እና እንደገና ይሞክሩ።',
    nothingHere: 'ምንም ምግብ የለም',
    unavail: 'አይገኝም',
    drawerTitle: 'ትዕዛዝዎ',
    cartEmpty: 'ለመጀመር ከምናሌ ምግቦች ያክሉ',
    nameLabel: 'ስምዎ',
    namePlaceholder: 'ለምሳሌ፡ አበበ',
    notesLabel: 'ልዩ መመሪያ',
    notesPlaceholder: 'አለርጂ፣ ምርጫዎች…',
    totalLabel: 'ጠቅላላ',
    orderBtn: 'ክፍያ ምረጡና ይዘዙ',
    waiterBtn: 'አስተናጋጅ ጥሩ',
    waiterCalling: 'በመደወል ላይ…',
    feedbackBtn: 'አስተያየት',
    fbTitle: 'ልምድዎ እንዴት ነበር?',
    fbSub: 'አስተያየትዎ ሁሌም ያስፈልገናል',
    fbPlaceholder: 'ተጨማሪ ይንገሩን...',
    fbCancel: 'ይቅር',
    fbSubmit: 'ላክ',
    toastAddedTo: 'ወደ ትዕዛዝ ታክሏል',
    toastWaiterCalled: 'አስተናጋጁ ተጠርቷል!',
    toastWaiterWait: 'ትንሽ ቆይተው እንደገና ይሞክሩ።',
    toastWaiterFail: 'አስተናጋጁ አልተደረሰም። ደግመው ይሞክሩ።',
    toastFbSent: 'አስተያየትዎ ደረሰን! ❤️',
    toastFbNoRating: 'እባኮትን ቅድሚያ ደረጃ ይስጡ።',
    toastCartEmpty: 'ጋሪዎ ባዶ ነው',
  }
};

/* ── LANGUAGE TOGGLE ───────────────────────── */
function t(key, ...args) {
  const val = T[currentLang][key];
  return typeof val === 'function' ? val(...args) : val;
}

function toggleLang() {
  currentLang = currentLang === 'en' ? 'am' : 'en';
  applyLang();
}

function applyLang() {
  const lang = T[currentLang];
  document.getElementById('langBtn').textContent       = lang.langBtn;
  document.getElementById('langBtn').classList.toggle('am', currentLang === 'am');
  document.getElementById('tableBadge').textContent    = lang.tableBadge(tableNum);
  document.getElementById('heroTagline').innerHTML     = lang.heroTagline;
  document.getElementById('heroSub').textContent       = lang.heroSub;
  document.getElementById('drawerTitleText').textContent = lang.drawerTitle;
  document.getElementById('nameLabel').textContent     = lang.nameLabel;
  document.getElementById('customerName').placeholder  = lang.namePlaceholder;
  document.getElementById('notesLabel').textContent    = lang.notesLabel;
  document.getElementById('specialNotes').placeholder  = lang.notesPlaceholder;
  document.getElementById('totalLabel').textContent    = lang.totalLabel;
  document.getElementById('orderBtnText').innerHTML    = lang.orderBtn;
  document.getElementById('waiterBtnLabel').textContent = lang.waiterBtn;
  document.getElementById('feedbackBtnLabel').textContent = lang.feedbackBtn;
  document.getElementById('fbTitle').textContent       = lang.fbTitle;
  document.getElementById('fbSub').textContent         = lang.fbSub;
  document.getElementById('feedbackText').placeholder  = lang.fbPlaceholder;
  document.getElementById('fbCancelBtn').textContent   = lang.fbCancel;
  document.getElementById('fbSubmitLabel').textContent = lang.fbSubmit;
  // Re-render categories and menu to update labels
  buildCategories();
  const activeBtn = document.querySelector('.cat-btn.active');
  const cat = activeBtn ? activeBtn.dataset.cat : 'all';
  renderMenu(cat === 'all' ? menuItems : menuItems.filter(i => i.category === cat));
  // Update cart empty text
  const cartEmptyEl = document.getElementById('cartEmptyText');
  if (cartEmptyEl) cartEmptyEl.textContent = lang.cartEmpty;
}

/* ── MENU LOADING ──────────────────────────── */
async function loadMenu() {
  try {
    const r = await fetch(`${API}/menu`);
    const d = await r.json();
    menuItems = d.menu || [];
    buildCategories();
    renderMenu(menuItems);
  } catch(e) {
    document.getElementById('menuGrid').innerHTML = `
      <div class="state-wrap" style="grid-column:1/-1;">
        <div class="state-icon"><i class="fas fa-wifi-slash"></i></div>
        <div class="state-title">${t('menuUnavail')}</div>
        <div class="state-sub">${t('menuUnavailSub')}</div>
      </div>`;
  }
}

function buildCategories() {
  const cats = ['all', ...new Set(menuItems.map(i => i.category).filter(Boolean))];
  const scroll = document.getElementById('catScroll');
  scroll.innerHTML = cats.map(c => `
    <button class="cat-btn ${c==='all'?'active':''}" data-cat="${c}" onclick="filterCat('${c}',this)">
      ${c === 'all' ? t('allItems') : cap(c)}
    </button>`).join('');
}

function filterCat(cat, el) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderMenu(cat === 'all' ? menuItems : menuItems.filter(i => i.category === cat));
  el.scrollIntoView({inline:'center', behavior:'smooth'});
}

function renderMenu(items) {
  const grid = document.getElementById('menuGrid');
  if(!items.length) {
    grid.innerHTML = `<div class="state-wrap" style="grid-column:1/-1;">
      <div class="state-icon"><i class="fas fa-utensils"></i></div>
      <div class="state-title">${t('nothingHere')}</div>
    </div>`;
    return;
  }
  grid.innerHTML = items.map(item => {
    const inCart = cart.find(c => c.id === item.id);
    const qty    = inCart ? inCart.quantity : 0;
    const imgSrc = item.imageurl || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80';
    return `
    <div class="menu-card" onclick="cardClick('${item.id}')">
      <div class="card-img-wrap">
        <img class="card-img" src="${imgSrc}" alt="${esc(item.name)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80'">
        ${!item.available ? `<div class="card-unavail-overlay">${t('unavail')}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${esc(item.name)}</div>
        ${item.description ? `<div class="card-desc">${esc(item.description)}</div>` : ''}
        <div class="card-footer">
          <span class="card-price">$${parseFloat(item.price).toFixed(2)}</span>
          ${item.available
            ? (qty > 0
              ? `<div class="qty-control" onclick="event.stopPropagation()">
                   <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
                   <span class="qty-num">${qty}</span>
                   <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
                 </div>`
              : `<button class="add-btn" onclick="event.stopPropagation();addItem('${item.id}')">+</button>`)
            : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── CART LOGIC ────────────────────────────── */
function cardClick(id) {
  const item = menuItems.find(i => i.id === id);
  if(!item || !item.available) return;
  addItem(id);
}

function addItem(id) {
  const item = menuItems.find(i => i.id === id);
  if(!item) return;
  const existing = cart.find(c => c.id === id);
  if(existing) existing.quantity++;
  else cart.push({...item, quantity:1});
  updateCartUI();
  showToast('success', `${item.name} ${t('toastAddedTo')}`);
}

function changeQty(id, delta) {
  const idx = cart.findIndex(c => c.id === id);
  if(idx < 0) return;
  cart[idx].quantity += delta;
  if(cart[idx].quantity <= 0) cart.splice(idx,1);
  updateCartUI();
}

function removeItem(id) {
  cart = cart.filter(c => c.id !== id);
  updateCartUI();
}

function cartTotal() { return cart.reduce((s,i) => s + i.price * i.quantity, 0); }

function updateCartUI() {
  const count = cart.reduce((s,i) => s + i.quantity, 0);
  const total = cartTotal();
  const fab   = document.getElementById('cartFab');
  document.getElementById('fabCount').textContent = count;
  document.getElementById('fabTotal').textContent = `$${total.toFixed(2)}`;
  fab.classList.toggle('visible', count > 0);
  renderDrawer();
  document.getElementById('drawerTotal').textContent = `$${total.toFixed(2)}`;
  const activeBtn = document.querySelector('.cat-btn.active');
  const cat = activeBtn ? activeBtn.dataset.cat : 'all';
  renderMenu(cat === 'all' ? menuItems : menuItems.filter(i => i.category === cat));
}

function renderDrawer() {
  const body = document.getElementById('drawerBody');
  if(!cart.length) {
    body.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛒</div><span id="cartEmptyText">${t('cartEmpty')}</span></div>`;
    return;
  }
  body.innerHTML = cart.map(item => `
    <div class="cart-item-row">
      <img class="ci-thumb" src="${item.imageurl||'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=100&q=60'}"
           alt="${esc(item.name)}" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=100&q=60'">
      <div class="ci-info">
        <div class="ci-name">${esc(item.name)}</div>
        <div class="ci-price">$${(item.price * item.quantity).toFixed(2)}</div>
      </div>
      <div class="ci-qty">
        <button class="ci-qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
        <span class="ci-qty-num">${item.quantity}</span>
        <button class="ci-qty-btn" onclick="changeQty('${item.id}',1)">+</button>
      </div>
    </div>`).join('');
}

/* ── DRAWER OPEN/CLOSE ─────────────────────── */
function openCart()  {
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── ORDER PLACEMENT ───────────────────────── */
function placeOrder() {
  if(!cart.length) { showToast('warning', t('toastCartEmpty')); return; }

  const confNum = genConfNum();
  const orderData = {
    confirmation_number: confNum,
    room: tableNum,
    table: tableNum,
    customerName: document.getElementById('customerName').value.trim() || 'Guest',
    specialInstructions: document.getElementById('specialNotes').value.trim() || '',
    items: cart.map(i => ({id:i.id, name:i.name, price:i.price, quantity:i.quantity})),
    total: cartTotal().toFixed(2),
    timestamp: new Date().toISOString(),
    status: 'pending',
    payment_status: 'pending',
    telegram_chat_id: tgChatId || null
  };

  sessionStorage.setItem('pending_order', JSON.stringify(orderData));
  pendingOrder = orderData;

  closeCart();
  cart = [];
  updateCartUI();

  const enc = encodeURIComponent(JSON.stringify(orderData));
  window.location.href = `payment.html?order=${enc}`;
}

function genConfNum() {
  const t2  = Date.now().toString().slice(-4);
  const r   = Math.floor(Math.random()*1000).toString().padStart(3,'0');
  const tbl = String(tableNum).padStart(2,'0');
  return `T${tbl}-${r}-${t2}`;
}

/* ── CALL WAITER ───────────────────────────── */
async function callWaiter() {
  if(waiterCooldown) { showToast('warning', t('toastWaiterWait')); return; }

  const btn = document.getElementById('waiterBtn');
  const lbl = document.getElementById('waiterBtnLabel');
  btn.classList.add('calling');
  lbl.textContent = t('waiterCalling');

  try {
    await fetch(`${API}/call-waiter`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        table: tableNum,
        room: tableNum,
        telegram_chat_id: tgChatId || null,
        timestamp: new Date().toISOString()
      })
    });
  } catch(e) {
    // Silent fail — still notify customer UI
  }

  showToast('success', t('toastWaiterCalled'));
  waiterCooldown = true;

  // Cooldown: 90 seconds
  setTimeout(() => {
    waiterCooldown = false;
    btn.classList.remove('calling');
    lbl.textContent = t('waiterBtn');
  }, 90000);

  // Visual: reset label after 3s but keep cooldown
  setTimeout(() => {
    lbl.textContent = t('waiterBtn');
    btn.classList.remove('calling');
  }, 3000);
}

/* ── FEEDBACK ──────────────────────────────── */
function openFeedback() {
  feedbackRating = 0;
  document.getElementById('feedbackText').value = '';
  updateStars(0);
  document.getElementById('feedbackModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeFeedback() {
  document.getElementById('feedbackModal').classList.remove('open');
  document.body.style.overflow = '';
}

function closeFeedbackOnBg(e) {
  if(e.target === document.getElementById('feedbackModal')) closeFeedback();
}

function rateStar(val) {
  feedbackRating = val;
  updateStars(val);
}

function updateStars(val) {
  document.querySelectorAll('.star-btn').forEach(btn => {
    btn.classList.toggle('lit', parseInt(btn.dataset.val) <= val);
  });
}

async function submitFeedback() {
  if(!feedbackRating) { showToast('warning', t('toastFbNoRating')); return; }

  const comment = document.getElementById('feedbackText').value.trim();
  const submitBtn = document.getElementById('fbSubmitBtn');
  submitBtn.disabled = true;
  submitBtn.style.opacity = '0.6';

  try {
    await fetch(`${API}/customer-feedback`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        table: tableNum,
        room: tableNum,
        rating: feedbackRating,
        comment: comment,
        telegram_chat_id: tgChatId || null,
        timestamp: new Date().toISOString()
      })
    });
  } catch(e) {
    // Silent fail — still thank customer
  }

  closeFeedback();
  showToast('success', t('toastFbSent'));

  submitBtn.disabled = false;
  submitBtn.style.opacity = '1';
}

/* ── TOAST ─────────────────────────────────── */
let toastTimer;
function showToast(type, msg) {
  const icons = {success:'check-circle',warning:'exclamation-triangle',error:'times-circle'};
  clearTimeout(toastTimer);
  document.querySelectorAll('.toast').forEach(t2 => t2.remove());
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fas fa-${icons[type]||'info-circle'} toast-icon"></i><span>${msg}</span>`;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

/* ── UTILS ─────────────────────────────────── */
function cap(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function esc(s) { return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ── INIT ──────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  // Set initial table badge
  document.getElementById('tableBadge').textContent =
    tableNum !== 'N/A' ? `Table ${tableNum}` : 'Walk-in';
  loadMenu();
});
</script>
