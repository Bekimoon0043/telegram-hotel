<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Café Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --espresso:  #120B07;
      --bark:      #2A1810;
      --copper:    #C8722A;
      --gold:      #E8A44A;
      --cream:     #F5ECD7;
      --cream-dim: #D9CDB8;
      --sand:      #8C7B66;
      --card-bg:   #1E120C;
      --overlay:   rgba(12,7,4,0.88);
      --success:   #3DAA6A;
      --error:     #C0392B;
      --warning:   #E67E22;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--espresso);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ────────────────────────────────── */
    .site-header {
      position: sticky; top:0; z-index:200;
      background: rgba(18,11,7,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200,114,42,0.2);
      padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand-icon { font-size:1.4rem; color:var(--copper); }
    .brand-name {
      font-family:'Cormorant Garamond',serif;
      font-size:1.25rem; font-weight:600; letter-spacing:.03em;
      color:var(--cream);
    }
    .table-badge {
      background: var(--bark);
      border: 1px solid var(--copper);
      border-radius:20px;
      padding: 5px 14px;
      font-size:.75rem; font-weight:600;
      color:var(--gold); letter-spacing:.08em;
      text-transform:uppercase;
    }

    /* ── HERO ──────────────────────────────────── */
    .hero {
      background: linear-gradient(160deg, var(--bark) 0%, var(--espresso) 60%);
      padding: 36px 24px 28px;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content:'';
      position:absolute; bottom:-1px; left:0; right:0; height:40px;
      background: linear-gradient(to top, var(--espresso), transparent);
    }
    .hero-tagline {
      font-family:'Cormorant Garamond',serif;
      font-size:2.2rem; font-weight:700; line-height:1.15;
      color:var(--cream); margin-bottom:8px;
    }
    .hero-tagline em { color:var(--gold); font-style:italic; }
    .hero-sub { color:var(--cream-dim); font-size:.9rem; font-weight:300; }

    /* ── CATEGORIES ────────────────────────────── */
    .categories-wrap {
      padding: 20px 0 4px;
      position: sticky; top:64px; z-index:100;
      background: var(--espresso);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .categories-scroll {
      display:flex; gap:8px; padding: 0 20px 12px;
      overflow-x:auto; scroll-snap-type:x mandatory;
      scrollbar-width:none;
    }
    .categories-scroll::-webkit-scrollbar { display:none; }
    .cat-btn {
      scroll-snap-align:start;
      flex-shrink:0;
      background: var(--bark);
      border: 1px solid rgba(200,114,42,0.2);
      color: var(--cream-dim);
      border-radius:30px;
      padding:8px 18px;
      font-family:'DM Sans',sans-serif;
      font-size:.82rem; font-weight:500;
      cursor:pointer; transition: all .25s ease;
      white-space:nowrap;
    }
    .cat-btn:hover { border-color:var(--copper); color:var(--cream); }
    .cat-btn.active {
      background: var(--copper);
      border-color: var(--copper);
      color: #fff;
      font-weight:600;
    }

    /* ── MENU GRID ─────────────────────────────── */
    .menu-section { padding: 20px 20px 120px; }
    .section-label {
      font-family:'Cormorant Garamond',serif;
      font-size:1.1rem; font-weight:600; color:var(--sand);
      letter-spacing:.12em; text-transform:uppercase;
      margin-bottom:16px;
    }
    .menu-grid {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap:14px;
    }

    /* ── MENU CARD ─────────────────────────────── */
    .menu-card {
      background: var(--card-bg);
      border-radius:14px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      cursor:pointer;
      position:relative;
    }
    .menu-card:hover {
      transform:translateY(-4px);
      border-color: rgba(200,114,42,0.4);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .menu-card:active { transform:scale(0.98); }
    .card-img-wrap { position:relative; height:130px; overflow:hidden; }
    .card-img {
      width:100%; height:100%;
      object-fit:cover; transition:transform .4s ease;
    }
    .menu-card:hover .card-img { transform:scale(1.06); }
    .card-unavail-overlay {
      position:absolute; inset:0;
      background:rgba(18,11,7,0.7);
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:600; color:#fff;
      letter-spacing:.1em; text-transform:uppercase;
    }
    .card-body { padding:12px; }
    .card-name {
      font-family:'Cormorant Garamond',serif;
      font-size:1.02rem; font-weight:600;
      color:var(--cream); line-height:1.25;
      margin-bottom:4px;
    }
    .card-desc {
      font-size:.73rem; color:var(--sand);
      line-height:1.4; margin-bottom:10px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .card-footer { display:flex; align-items:center; justify-content:space-between; }
    .card-price {
      font-size:.95rem; font-weight:600; color:var(--gold);
    }
    .add-btn {
      width:30px; height:30px;
      background: var(--copper);
      border:none; border-radius:50%;
      color:#fff; font-size:1.1rem;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition: background .2s ease, transform .2s ease;
      line-height:1;
    }
    .add-btn:hover { background:var(--gold); transform:scale(1.12); }
    .qty-control {
      display:flex; align-items:center; gap:8px;
    }
    .qty-btn {
      width:26px; height:26px;
      background:transparent; border:1px solid var(--copper);
      border-radius:50%; color:var(--copper);
      font-size:.85rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition: all .2s ease;
    }
    .qty-btn:hover { background:var(--copper); color:#fff; }
    .qty-num { font-size:.9rem; font-weight:600; color:var(--cream); min-width:18px; text-align:center; }

    /* ── LOADING/EMPTY ─────────────────────────── */
    .state-wrap {
      text-align:center; padding:60px 20px;
    }
    .state-icon { font-size:3rem; color:var(--sand); margin-bottom:16px; }
    .state-title { font-family:'Cormorant Garamond',serif; font-size:1.5rem; color:var(--cream-dim); margin-bottom:8px; }
    .state-sub { font-size:.9rem; color:var(--sand); }
    .spinner {
      width:40px; height:40px; margin:0 auto 20px;
      border:3px solid rgba(200,114,42,0.2);
      border-top-color:var(--copper);
      border-radius:50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg);} }

    /* ── FLOATING CART ─────────────────────────── */
    .cart-fab {
      position:fixed; bottom:24px; right:20px; z-index:300;
      background: linear-gradient(135deg, var(--copper), var(--gold));
      border:none; border-radius:50px;
      padding:14px 22px;
      color:#fff; font-family:'DM Sans',sans-serif;
      font-size:.9rem; font-weight:600;
      display:flex; align-items:center; gap:10px;
      cursor:pointer; box-shadow:0 8px 24px rgba(200,114,42,0.45);
      transition:all .3s cubic-bezier(.4,0,.2,1);
      transform:translateY(80px); opacity:0;
    }
    .cart-fab.visible { transform:translateY(0); opacity:1; }
    .cart-fab:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 12px 32px rgba(200,114,42,0.55); }
    .cart-fab .fab-count {
      background:#fff; color:var(--copper);
      border-radius:50%; width:22px; height:22px;
      font-size:.75rem; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }
    .cart-fab .fab-total { font-size:.85rem; }

    /* ── CART DRAWER ───────────────────────────── */
    .drawer-overlay {
      position:fixed; inset:0; z-index:500;
      background:var(--overlay);
      opacity:0; pointer-events:none;
      transition:opacity .3s ease;
    }
    .drawer-overlay.open { opacity:1; pointer-events:all; }
    .cart-drawer {
      position:fixed; bottom:0; left:0; right:0; z-index:501;
      background: var(--bark);
      border-radius:20px 20px 0 0;
      border-top: 2px solid var(--copper);
      padding:0 0 env(safe-area-inset-bottom,0);
      transform:translateY(100%);
      transition:transform .38s cubic-bezier(.4,0,.2,1);
      max-height:90vh;
      display:flex; flex-direction:column;
    }
    .cart-drawer.open { transform:translateY(0); }
    .drawer-handle {
      width:40px; height:4px; border-radius:2px;
      background:rgba(255,255,255,0.2);
      margin:12px auto 0;
    }
    .drawer-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 20px 12px;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .drawer-title {
      font-family:'Cormorant Garamond',serif;
      font-size:1.4rem; font-weight:600;
    }
    .drawer-close {
      background:transparent; border:none; color:var(--cream-dim);
      font-size:1.2rem; cursor:pointer; padding:4px;
    }
    .drawer-body { flex:1; overflow-y:auto; padding:16px 20px; }
    .cart-item-row {
      display:flex; align-items:center; gap:12px;
      padding:12px 0;
      border-bottom:1px solid rgba(255,255,255,0.06);
      animation:slideIn .25s ease;
    }
    @keyframes slideIn { from{opacity:0;transform:translateX(-10px);} to{opacity:1;transform:none;} }
    .ci-thumb {
      width:50px; height:50px; border-radius:8px;
      object-fit:cover; flex-shrink:0;
    }
    .ci-info { flex:1; }
    .ci-name { font-size:.9rem; font-weight:600; color:var(--cream); }
    .ci-price { font-size:.8rem; color:var(--gold); margin-top:2px; }
    .ci-qty {
      display:flex; align-items:center; gap:8px;
    }
    .ci-qty-btn {
      width:26px; height:26px;
      background:var(--espresso); border:1px solid rgba(200,114,42,0.3);
      border-radius:50%; color:var(--cream);
      font-size:.85rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:all .2s;
    }
    .ci-qty-btn:hover { border-color:var(--copper); color:var(--copper); }
    .ci-qty-num { font-size:.9rem; font-weight:600; min-width:20px; text-align:center; }
    .cart-empty {
      text-align:center; padding:48px 0;
      color:var(--sand); font-size:.95rem;
    }
    .cart-empty-icon { font-size:2.5rem; margin-bottom:12px; color:var(--bark); }

    /* customer name + notes */
    .drawer-fields { padding:0 20px 12px; }
    .field-group { margin-bottom:12px; }
    .field-label { font-size:.75rem; font-weight:600; color:var(--sand); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; display:block; }
    .field-input {
      width:100%;
      background:var(--espresso); border:1px solid rgba(255,255,255,0.1);
      border-radius:10px; color:var(--cream);
      padding:10px 14px; font-family:'DM Sans',sans-serif; font-size:.9rem;
      transition:border-color .2s;
    }
    .field-input:focus { outline:none; border-color:var(--copper); }
    .field-input::placeholder { color:var(--sand); }

    /* drawer footer */
    .drawer-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.08); }
    .drawer-total {
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:14px;
    }
    .drawer-total-label { font-size:.85rem; color:var(--cream-dim); }
    .drawer-total-amount { font-family:'Cormorant Garamond',serif; font-size:1.6rem; font-weight:700; color:var(--gold); }
    .order-btn {
      width:100%; padding:16px;
      background:linear-gradient(135deg,var(--copper),var(--gold));
      border:none; border-radius:14px;
      color:#fff; font-family:'DM Sans',sans-serif;
      font-size:1rem; font-weight:600; letter-spacing:.03em;
      cursor:pointer; transition:all .3s ease;
      display:flex; align-items:center; justify-content:center; gap:10px;
    }
    .order-btn:hover { opacity:.9; transform:translateY(-1px); }
    .order-btn:disabled { background:var(--sand); cursor:not-allowed; transform:none; }

    /* ── TOAST ─────────────────────────────────── */
    .toast {
      position:fixed; top:80px; left:50%; transform:translateX(-50%);
      z-index:600;
      background:var(--card-bg); border:1px solid rgba(200,114,42,0.4);
      border-radius:10px; padding:12px 20px;
      font-size:.88rem; font-weight:500; color:var(--cream);
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      display:flex; align-items:center; gap:10px;
      animation:toastIn .3s ease;
      pointer-events:none;
    }
    @keyframes toastIn { from{opacity:0;top:60px;} to{opacity:1;top:80px;} }
    .toast.success .toast-icon { color:var(--success); }
    .toast.warning .toast-icon { color:var(--warning); }
    .toast.error   .toast-icon { color:var(--error); }

    /* ── ORDER MODAL ───────────────────────────── */
    .modal-overlay {
      position:fixed; inset:0; z-index:700;
      background:var(--overlay);
      display:flex; align-items:center; justify-content:center;
      padding:20px;
      opacity:0; pointer-events:none; transition:opacity .3s;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal-box {
      background:var(--bark);
      border:1px solid rgba(200,114,42,0.3);
      border-radius:20px;
      padding:32px 28px;
      max-width:420px; width:100%;
      text-align:center;
      transform:scale(.95); transition:transform .3s;
    }
    .modal-overlay.open .modal-box { transform:scale(1); }
    .modal-icon { font-size:3rem; margin-bottom:16px; }
    .modal-title { font-family:'Cormorant Garamond',serif; font-size:1.8rem; font-weight:600; margin-bottom:8px; }
    .modal-sub { color:var(--cream-dim); font-size:.9rem; margin-bottom:20px; }
    .modal-conf {
      background:var(--espresso); border-radius:12px; padding:18px;
      margin-bottom:20px; border:1px solid rgba(200,114,42,0.2);
    }
    .conf-label { font-size:.72rem; color:var(--sand); letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
    .conf-code {
      font-family:'Cormorant Garamond',serif;
      font-size:1.6rem; font-weight:700; color:var(--gold);
      letter-spacing:.05em;
    }
    .modal-btn {
      width:100%; padding:14px;
      background:var(--copper); border:none; border-radius:12px;
      color:#fff; font-family:'DM Sans',sans-serif;
      font-size:.95rem; font-weight:600;
      cursor:pointer; transition:background .2s;
    }
    .modal-btn:hover { background:var(--gold); }

    /* ── RESPONSIVE ────────────────────────────── */
    @media(min-width:600px) {
      .menu-grid { grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); }
      .hero-tagline { font-size:2.8rem; }
      .cart-drawer { max-width:480px; left:auto; right:0; border-radius:20px 20px 0 0; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="brand">
    <i class="fas fa-mug-hot brand-icon"></i>
    <span class="brand-name">The Craft Café</span>
  </div>
  <div class="table-badge" id="tableBadge">Table —</div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-tagline">Made with love,<br><em>served with care.</em></div>
  <div class="hero-sub">Browse our menu and order directly from your table.</div>
</section>

<!-- CATEGORIES -->
<div class="categories-wrap">
  <div class="categories-scroll" id="catScroll">
    <button class="cat-btn active" data-cat="all">All Items</button>
  </div>
</div>

<!-- MENU -->
<section class="menu-section">
  <div class="menu-grid" id="menuGrid">
    <div class="state-wrap" style="grid-column:1/-1;">
      <div class="spinner"></div>
      <div class="state-title">Loading menu…</div>
    </div>
  </div>
</section>

<!-- FLOATING CART -->
<button class="cart-fab" id="cartFab" onclick="openCart()">
  <i class="fas fa-shopping-bag"></i>
  <span class="fab-count" id="fabCount">0</span>
  <span class="fab-total" id="fabTotal">$0.00</span>
  <i class="fas fa-chevron-up" style="font-size:.7rem;opacity:.7;"></i>
</button>

<!-- DRAWER OVERLAY -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeCart()"></div>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cartDrawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <div class="drawer-title"><i class="fas fa-shopping-bag" style="color:var(--copper);margin-right:8px;font-size:.9em;"></i>Your Order</div>
    <button class="drawer-close" onclick="closeCart()"><i class="fas fa-times"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="cart-empty">
      <div class="cart-empty-icon">🛒</div>
      Add items from the menu to get started
    </div>
  </div>
  <div class="drawer-fields">
    <div class="field-group">
      <label class="field-label" for="customerName">Your Name</label>
      <input class="field-input" type="text" id="customerName" placeholder="e.g. Alex" maxlength="50">
    </div>
    <div class="field-group">
      <label class="field-label" for="specialNotes">Special Instructions</label>
      <input class="field-input" type="text" id="specialNotes" placeholder="Allergies, preferences…" maxlength="200">
    </div>
  </div>
  <div class="drawer-footer">
    <div class="drawer-total">
      <span class="drawer-total-label">Total</span>
      <span class="drawer-total-amount" id="drawerTotal">$0.00</span>
    </div>
    <button class="order-btn" id="orderBtn" onclick="placeOrder()">
      <i class="fas fa-credit-card"></i> Choose Payment &amp; Order
    </button>
  </div>
</div>

<!-- Confirmation modal removed: users go directly to payment.html after clicking Place Order -->

<script>
const API   = 'https://n8n-n64x.onrender.com/webhook';
const GITHUB = 'https://bekimoon0043.github.io/telegram-hotel';

/* ── URL PARAMS ────────────────────────────── */
const urlParams = new URLSearchParams(location.search);
let tableNum    = urlParams.get('table') || urlParams.get('room') || 'N/A';
let tgChatId    = urlParams.get('telegram_chat_id') || '';
document.getElementById('tableBadge').textContent = tableNum !== 'N/A' ? `Table ${tableNum}` : 'Walk-in';

/* ── STATE ─────────────────────────────────── */
let menuItems = [];
let cart      = [];
let pendingOrder = null;

/* ── MENU LOADING ──────────────────────────── */
async function loadMenu() {
  try {
    const r = await fetch(`${API}/menu`);
    const d = await r.json();
    menuItems = d.menu || [];
    buildCategories();
    renderMenu(menuItems);
  } catch(e) {
    document.getElementById('menuGrid').innerHTML = `
      <div class="state-wrap" style="grid-column:1/-1;">
        <div class="state-icon"><i class="fas fa-wifi-slash"></i></div>
        <div class="state-title">Menu unavailable</div>
        <div class="state-sub">Please check your connection and try again.</div>
      </div>`;
  }
}

function buildCategories() {
  const cats = ['all', ...new Set(menuItems.map(i => i.category).filter(Boolean))];
  const scroll = document.getElementById('catScroll');
  scroll.innerHTML = cats.map(c => `
    <button class="cat-btn ${c==='all'?'active':''}" data-cat="${c}" onclick="filterCat('${c}',this)">
      ${c === 'all' ? 'All Items' : cap(c)}
    </button>`).join('');
}

function filterCat(cat, el) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderMenu(cat === 'all' ? menuItems : menuItems.filter(i => i.category === cat));
  el.scrollIntoView({inline:'center', behavior:'smooth'});
}

function renderMenu(items) {
  const grid = document.getElementById('menuGrid');
  if(!items.length) {
    grid.innerHTML = `<div class="state-wrap" style="grid-column:1/-1;">
      <div class="state-icon"><i class="fas fa-utensils"></i></div>
      <div class="state-title">Nothing here yet</div>
    </div>`;
    return;
  }
  grid.innerHTML = items.map(item => {
    const inCart  = cart.find(c => c.id === item.id);
    const qty     = inCart ? inCart.quantity : 0;
    const imgSrc  = item.imageurl || 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80';
    return `
    <div class="menu-card" onclick="cardClick('${item.id}')">
      <div class="card-img-wrap">
        <img class="card-img" src="${imgSrc}" alt="${esc(item.name)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&q=80'">
        ${!item.available ? '<div class="card-unavail-overlay">Unavailable</div>' : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${esc(item.name)}</div>
        ${item.description ? `<div class="card-desc">${esc(item.description)}</div>` : ''}
        <div class="card-footer">
          <span class="card-price">$${parseFloat(item.price).toFixed(2)}</span>
          ${item.available
            ? (qty > 0
              ? `<div class="qty-control" onclick="event.stopPropagation()">
                   <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
                   <span class="qty-num">${qty}</span>
                   <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
                 </div>`
              : `<button class="add-btn" onclick="event.stopPropagation();addItem('${item.id}')">+</button>`)
            : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── CART LOGIC ────────────────────────────── */
function cardClick(id) {
  const item = menuItems.find(i => i.id === id);
  if(!item || !item.available) return;
  addItem(id);
}

function addItem(id) {
  const item = menuItems.find(i => i.id === id);
  if(!item) return;
  const existing = cart.find(c => c.id === id);
  if(existing) existing.quantity++;
  else cart.push({...item, quantity:1});
  updateCartUI();
  showToast('success', `${item.name} added to order`);
}

function changeQty(id, delta) {
  const idx = cart.findIndex(c => c.id === id);
  if(idx < 0) return;
  cart[idx].quantity += delta;
  if(cart[idx].quantity <= 0) cart.splice(idx,1);
  updateCartUI();
}

function removeItem(id) {
  cart = cart.filter(c => c.id !== id);
  updateCartUI();
}

function cartTotal() { return cart.reduce((s,i) => s + i.price * i.quantity, 0); }

function updateCartUI() {
  const count = cart.reduce((s,i) => s + i.quantity, 0);
  const total  = cartTotal();
  // FAB
  const fab = document.getElementById('cartFab');
  document.getElementById('fabCount').textContent  = count;
  document.getElementById('fabTotal').textContent  = `$${total.toFixed(2)}`;
  fab.classList.toggle('visible', count > 0);
  // Drawer body
  renderDrawer();
  // Drawer total
  document.getElementById('drawerTotal').textContent = `$${total.toFixed(2)}`;
  // Re-render menu cards for qty buttons
  const activeBtn = document.querySelector('.cat-btn.active');
  const cat = activeBtn ? activeBtn.dataset.cat : 'all';
  renderMenu(cat === 'all' ? menuItems : menuItems.filter(i => i.category === cat));
}

function renderDrawer() {
  const body = document.getElementById('drawerBody');
  if(!cart.length) {
    body.innerHTML = '<div class="cart-empty"><div class="cart-empty-icon">🛒</div>Add items from the menu to get started</div>';
    return;
  }
  body.innerHTML = cart.map(item => `
    <div class="cart-item-row">
      <img class="ci-thumb" src="${item.imageurl||'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=100&q=60'}"
           alt="${esc(item.name)}" onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=100&q=60'">
      <div class="ci-info">
        <div class="ci-name">${esc(item.name)}</div>
        <div class="ci-price">$${(item.price * item.quantity).toFixed(2)}</div>
      </div>
      <div class="ci-qty">
        <button class="ci-qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
        <span class="ci-qty-num">${item.quantity}</span>
        <button class="ci-qty-btn" onclick="changeQty('${item.id}',1)">+</button>
      </div>
    </div>`).join('');
}

/* ── DRAWER OPEN/CLOSE ─────────────────────── */
function openCart()  {
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ── ORDER PLACEMENT ───────────────────────── */
// NOTE: The order is NOT sent to n8n here.
// It is saved locally and sent to n8n only after the user
// selects a payment method and submits in payment.html.
function placeOrder() {
  if(!cart.length) { showToast('warning','Your cart is empty'); return; }

  const confNum = genConfNum();
  const orderData = {
    confirmation_number: confNum,
    room: tableNum,
    table: tableNum,
    customerName: document.getElementById('customerName').value.trim() || 'Guest',
    specialInstructions: document.getElementById('specialNotes').value.trim() || '',
    items: cart.map(i => ({id:i.id, name:i.name, price:i.price, quantity:i.quantity})),
    total: cartTotal().toFixed(2),
    timestamp: new Date().toISOString(),
    status: 'pending',
    payment_status: 'pending',
    telegram_chat_id: tgChatId || null
  };

  // Save locally only — sent to n8n after payment is chosen
  sessionStorage.setItem('pending_order', JSON.stringify(orderData));
  pendingOrder = orderData;

  closeCart();
  cart = [];
  updateCartUI();

  // Go directly to payment page
  const enc = encodeURIComponent(JSON.stringify(orderData));
  window.location.href = `payment.html?order=${enc}`;
}

function genConfNum() {
  const t   = Date.now().toString().slice(-4);
  const r   = Math.floor(Math.random()*1000).toString().padStart(3,'0');
  const tbl = String(tableNum).padStart(2,'0');
  return `T${tbl}-${r}-${t}`;
}

/* ── TOAST ─────────────────────────────────── */
let toastTimer;
function showToast(type, msg) {
  const icons = {success:'check-circle',warning:'exclamation-triangle',error:'times-circle'};
  clearTimeout(toastTimer);
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<i class="fas fa-${icons[type]||'info-circle'} toast-icon"></i><span>${msg}</span>`;
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2800);
}

/* ── UTILS ─────────────────────────────────── */
function cap(s) { return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function esc(s) { return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ── INIT ──────────────────────────────────── */
document.addEventListener('DOMContentLoaded', loadMenu);
</script>
